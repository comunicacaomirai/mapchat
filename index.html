<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MAPCHAT - Recados Locais</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { --primary: #e74c3c; --admin: #2c3e50; --gold: #f1c40f; --news: #3498db; --shadow: 0 4px 15px rgba(0,0,0,0.15); }
        body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #f4f4f4; }
        #map { height: calc(100vh - 70px); width: 100%; margin-top: 35px; z-index: 1; }
        .safety-banner { position: fixed; top: 0; width: 100%; background: rgba(44, 62, 80, 0.9); color: white; text-align: center; padding: 8px; font-size: 11px; z-index: 4000; backdrop-filter: blur(5px); font-weight: bold; letter-spacing: 1px; }
        
        #push-notification { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--admin); color: white; padding: 15px; border-radius: 15px; z-index: 10000; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        #push-notification.show { top: 50px; }

        .leaflet-popup-content-wrapper { border-radius: 15px; padding: 5px; box-shadow: var(--shadow); }
        #mural-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100vh - 70px); background: #f8f9fa; z-index: 1500; display: none; overflow-y: auto; padding: 60px 20px 20px 20px; box-sizing: border-box; }
        .card-mural { background: #fff; padding: 18px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card-comercial { border-left: 5px solid var(--gold); background: #fffdf0; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: white; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -2px 15px rgba(0,0,0,0.08); z-index: 2000; }
        .nav-btn { border:none; background:none; font-weight:600; color: #7f8c8d; cursor:pointer; display: flex; flex-direction: column; align-items: center; font-size: 10px; text-align: center; }
        .nav-btn.active { color: var(--primary); }
        
        #entry-form { position: fixed; inset: 0; background: white; z-index: 9999; padding: 25px; display: flex; flex-direction: column; gap: 12px; display: none; overflow-y: auto;}
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-entrar { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-voltar { background: #ecf0f1; color: #7f8c8d; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .admin-panel { margin-top: 15px; padding: 15px; background: #f0f2f5; border-radius: 12px; border: 1px dashed var(--admin); }
        .status-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .status-on { background: #2ecc71; color: white; }
        .status-off { background: #95a5a6; color: white; }
    </style>
</head>
<body>

    <div id="push-notification">
        <div id="push-text"></div>
        <button onclick="document.getElementById('push-notification').classList.remove('show')" style="background:none; border:none; color:white; font-size: 20px;">&times;</button>
    </div>

    <div class="safety-banner">💬 O QUE ESTÃO FALANDO POR PERTO AGORA?</div>

    <div id="entry-form">
        <h2 style="text-align: center; color: var(--admin);">Novo Recado Anônimo</h2>
        <input type="text" id="user-name" placeholder="Apelido ou Anônimo" oninput="checkAdmin(this.value)">
        <input type="tel" id="user-whatsapp" placeholder="WhatsApp (opcional)">
        <textarea id="user-msg" placeholder="O que está acontecendo por aqui?" rows="3" maxlength="150" oninput="document.getElementById('char-count').innerText = this.value.length + ' / 150'"></textarea>
        <div style="font-size: 11px; color: #999; text-align: right;" id="char-count">0 / 150</div>
        
        <button class="btn-entrar" id="btn-postar">PUBLICAR NO MAPA</button>
        <button class="btn-voltar" onclick="fecharFormulario()">CANCELAR</button>

        <div id="admin-menu" style="display:none;" class="admin-panel">
            <small>🛠 <b>PAINEL MIRAI ADM</b></small>
            <div id="status-indicators" style="margin-top:5px;">
                <span id="label-mod" class="status-badge status-off">Moderação OFF</span>
                <span id="label-com" class="status-badge status-off">Comercial OFF</span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                <button onclick="toggleModoGerenciar()" style="padding: 8px; font-size: 11px;">Moderar</button>
                <button onclick="setPostComercial()" style="padding: 8px; font-size: 11px; background: var(--gold); border:none; border-radius:5px;">Comercial</button>
            </div>
            <button onclick="enviarPushGlobal()" style="width:100%; margin-top:10px; padding:10px; background: var(--admin); color:white; border:none; border-radius:8px; font-size:11px;">🚀 PUSH GLOBAL</button>
        </div>
    </div>

    <div id="mural-view"><div id="lista-recados"></div></div>
    <div id="map"></div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="btn-nav-mapa" onclick="switchTab('mapa')">📍<br>MAPA</button>
        
        <button class="nav-btn" onclick="abrirPostagem()" style="background: var(--primary); color: white; width: 85px; height: 85px; border-radius: 50%; margin-top: -45px; box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4); font-size: 9px; font-weight: bold; border: 4px solid white; z-index: 3000;">
            <span style="font-size: 22px; line-height: 1;">📝</span><br>SOLTAR<br>RECADO
        </button>

        <button class="nav-btn" id="btn-nav-mural" onclick="switchTab('mural')">📋<br>MURAL</button>
    </nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, Timestamp, doc, deleteDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAIO2x_OKrctSsNltwSIFqWnZIS2qKrRTQ",
        authDomain: "mapchat-26100.firebaseapp.com",
        projectId: "mapchat-26100",
        storageBucket: "mapchat-26100.firebasestorage.app",
        messagingSenderId: "883564076959",
        appId: "1:883564076959:web:d167a09100df5a9b46a7aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_KEY = "MIRAI2026";
    const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbzPS1Un54LZBfG7UZF6c1Gfdpfp7-Pq3Pm9MZr5pID1fQaLHAxXtKGOeZ77XNauYhfg/exec";
    
    let isModoComercial = false;
    let isModoGerenciar = false;

    const map = L.map('map', { zoomControl: false }).setView([-25.41, -49.10], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);

    // --- SISTEMA DE NOTÍCIAS AUTOMÁTICAS (3 por cidade) ---
    async function carregarNoticiasLocais() {
        const RSS_URL = "https://g1.globo.com/rss/g1/pr/parana/";
        const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            const cidades = [
                { nome: "Pinhais", lat: -25.4411, lng: -49.1927 },
                { nome: "Quatro Barras", lat: -25.3661, lng: -49.0772 },
                { nome: "Campina G. do Sul", lat: -25.3050, lng: -49.0550 }
            ];

            let newsIdx = 0;
            cidades.forEach(cid => {
                for(let i=0; i<3; i++) {
                    const item = data.items[newsIdx % data.items.length];
                    const newsIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/2537/2537926.png', iconSize: [30, 30] });
                    const marker = L.marker([cid.lat + (Math.random()*0.01), cid.lng + (Math.random()*0.01)], { icon: newsIcon });
                    marker.bindPopup(`<div style="width:180px"><small style="color:var(--news)"><b>NOTÍCIA: ${cid.nome}</b></small><br><strong>${item.title}</strong><br><a href="${item.link}" target="_blank" style="font-size:10px;">Ver mais...</a></div>`);
                    markersCluster.addLayer(marker);
                    newsIdx++;
                }
            });
        } catch (e) { console.log("Erro notícias"); }
    }

    // --- POVOAMENTO INICIAL (Recados Isca) ---
    const recadosIniciais = [
        // Pinhais
        { n: "Anônimo", m: "Radar da Jacob Macanhan tá multando mesmo?", lat: -25.438, lng: -49.185 },
        { n: "Morador", m: "Melhor pastel da feira de Pinhais!", lat: -25.442, lng: -49.195 },
        { n: "User99", m: "Trânsito pesado perto do terminal agora.", lat: -25.445, lng: -49.191 },
        { n: "Anônimo", m: "Perdi chaves no Bosque Municipal, alguém viu?", lat: -25.440, lng: -49.180 },
        { n: "Vôlei", m: "Alguém pro Parcão hoje 17h?", lat: -25.435, lng: -49.190 },
        // Campina Grande do Sul (Jardim Paulista)
        { n: "Saúde", m: "Posto do Jardim Paulista tá vazio hoje!", lat: -25.318, lng: -49.088 },
        { n: "Cuidado", m: "Cachorro solto na Pres. Faria, fiquem espertos.", lat: -25.315, lng: -49.085 },
        { n: "Fofoca", m: "Alguém sabe da luz aqui no Jd Paulista?", lat: -25.320, lng: -49.090 },
        { n: "Lanche", m: "Carrinho novo na praça é 10/10!", lat: -25.317, lng: -49.087 },
        { n: "Plantão", m: "Qual farmácia tá aberta aqui agora?", lat: -25.319, lng: -49.089 },
        // Quatro Barras
        { n: "Natureza", m: "Morro do Samambaia amanhã cedo?", lat: -25.365, lng: -49.070 },
        { n: "Dica", m: "Graciosa tá linda hoje!", lat: -25.360, lng: -49.080 },
        { n: "Aviso", m: "Muita neblina no centro de QB.", lat: -25.368, lng: -49.075 },
        { n: "Obra", m: "Alguém indica pedreiro em Quatro Barras?", lat: -25.370, lng: -49.078 },
        { n: "Evento", m: "Vai ter música na praça hoje?", lat: -25.366, lng: -49.072 }
    ];

    function plotarRecadosIsca() {
        recadosIniciais.forEach(r => {
            const icon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3177/3177361.png', iconSize: [35, 35] });
            const m = L.marker([r.lat, r.lng], { icon });
            m.bindPopup(`<b>${r.n}</b><p>${r.m}</p>`);
            markersCluster.addLayer(m);
        });
    }

    // --- FUNÇÕES DE NAVEGAÇÃO ---
    window.abrirPostagem = () => { document.getElementById('entry-form').style.display = 'flex'; };
    window.fecharFormulario = () => { document.getElementById('entry-form').style.display = 'none'; };
    window.switchTab = (tab) => {
        document.getElementById('mural-view').style.display = tab === 'mural' ? 'block' : 'none';
        document.getElementById('btn-nav-mapa').classList.toggle('active', tab === 'mapa');
        document.getElementById('btn-nav-mural').classList.toggle('active', tab === 'mural');
        if(tab === 'mapa') fecharFormulario();
    };

    window.checkAdmin = (val) => { document.getElementById('admin-menu').style.display = val.includes(ADMIN_KEY) ? 'block' : 'none'; };
    window.toggleModoGerenciar = () => { isModoGerenciar = !isModoGerenciar; document.getElementById('label-mod').innerText = isModoGerenciar ? "Moderação ON" : "Moderação OFF"; };
    window.setPostComercial = () => { isModoComercial = !isModoComercial; document.getElementById('label-com').innerText = isModoComercial ? "Comercial ON" : "Comercial OFF"; };

    // --- POSTAGEM ---
    document.getElementById('btn-postar').addEventListener('click', async () => {
        const btn = document.getElementById('btn-postar');
        const nomeRaw = document.getElementById('user-name').value;
        const msg = document.getElementById('user-msg').value;
        if(!msg) return alert("Escreva um recado!");

        btn.disabled = true;
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const dados = {
                nome: (nomeRaw.replace(ADMIN_KEY, "").trim()) || "Anônimo",
                recado: msg,
                tipo: isModoComercial ? 'comercial' : 'normal',
                likes: 0,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                timestamp: Timestamp.now()
            };
            try {
                await addDoc(collection(db, "pins"), dados);
                fecharFormulario();
                document.getElementById('user-msg').value = "";
            } catch (e) { alert("Erro ao publicar."); }
            btn.disabled = false;
        }, () => { alert("Ative o GPS para postar!"); btn.disabled = false; });
    });

    // --- SINCRONIZAÇÃO FIREBASE ---
    const corte24h = Timestamp.fromMillis(Date.now() - (24 * 60 * 60 * 1000));
    onSnapshot(query(collection(db, "pins"), where("timestamp", ">", corte24h)), (snap) => {
        markersCluster.clearLayers();
        plotarRecadosIsca(); // Garante que as iscas fiquem no mapa
        carregarNoticiasLocais(); 
        
        document.getElementById('lista-recados').innerHTML = "";
        snap.forEach(d => {
            const val = d.data();
            const isCom = val.tipo === 'comercial';
            const iconUrl = isCom ? 'https://cdn-icons-png.flaticon.com/512/1169/1169908.png' : 'https://cdn-icons-png.flaticon.com/512/3177/3177361.png';
            const marker = L.marker([val.lat, val.lng], { icon: L.icon({iconUrl, iconSize:[35,35]}) });
            marker.bindPopup(`<b>${val.nome}</b><p>${val.recado}</p>`);
            markersCluster.addLayer(marker);

            document.getElementById('lista-recados').innerHTML += `
                <div class="card-mural ${isCom ? 'card-comercial' : ''}">
                    <strong>${isCom ? '⭐ ' : ''}${val.nome}</strong>
                    <p>${val.recado}</p>
                </div>`;
        });
    });

    // Inicialização
    carregarNoticiasLocais();
    plotarRecadosIsca();
</script>
</body>
</html>
